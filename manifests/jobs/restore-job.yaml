apiVersion: batch/v1
kind: Job
metadata:
  name: restore-114441256
  namespace: migrate-114441256
  labels:
    app: restore-114441256
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: restore-114441256
    spec:
      restartPolicy: Never
      containers:
      - name: restore
        image: mysql:8.4
        imagePullPolicy: IfNotPresent
        env:
        - name: MYSQL_PWD
          valueFrom:
            secretKeyRef:
              name: db-credentials-114441256
              key: MYSQL_ROOT_PASSWORD
        command:
        - /bin/bash
        - -c
        - |
          set -eu
          echo "=== Restore Job for cluster B ==="

          echo "Waiting for DB to be reachable..."
          for i in $(seq 1 30); do
            if mysqladmin ping -h db-114441256 -uroot --silent 2>/dev/null; then
              echo "DB is reachable"
              break
            fi
            echo "attempt $i: DB not ready, sleeping 2s"
            sleep 2
          done

          if [ ! -f /mnt/migrate/dump.sql ]; then
            echo "ERROR: /mnt/migrate/dump.sql not found. Was the dump job run first?"
            exit 1
          fi

          BYTES=$(stat -c%s /mnt/migrate/dump.sql)
          echo "Dump file size to restore: $BYTES bytes"
          echo "SHA256 of dump.sql (on cluster B side):"
          sha256sum /mnt/migrate/dump.sql

          echo "Truncating any existing rows in appdb.records to allow clean restore..."
          mysql -h db-114441256 -uroot -e "TRUNCATE TABLE appdb.records;" || true

          echo "Restoring dump..."
          mysql -h db-114441256 -uroot < /mnt/migrate/dump.sql

          COUNT=$(mysql -h db-114441256 -uroot -N -B -e "SELECT COUNT(*) FROM appdb.records;")
          echo "Row count on cluster B after restore: $COUNT"

          echo "=== Restore job complete ==="
        volumeMounts:
        - name: migrate
          mountPath: /mnt/migrate
      volumes:
      - name: migrate
        hostPath:
          path: /mnt/migrate
          type: Directory
